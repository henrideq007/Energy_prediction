[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast"
version = "0.1.0"
description = "Day-ahead (24h) electricity price and production forecasting for the Belgian bidding zone"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Henri Dequenne" }]
license = "MIT"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "entsoe-py>=0.6",
  "yfinance>=0.2.40",
  "holidays>=0.50",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "ipykernel>=6"]

[project.scripts]
energy-forecast = "energy_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
