# ---------------------------------------------------------------------------
# Energy Price & Production Forecasting — Belgium (BE bidding zone)
# Every key here is read by src/energy_forecast/config.py.
# Change values here rather than in code, and log important changes in
# docs/DECISIONS.md + the Notion "Decision Log".
# ---------------------------------------------------------------------------

project:
  name: energy-price-prediction
  timezone: Europe/Brussels        # all user-facing outputs in local time
  bidding_zone: BE                 # ENTSO-E area code (entsoe-py)
  neighbours: [FR, NL, DE_LU]      # cross-border price features
  start: "2019-01-01"              # history start (UTC date)
  end: null                        # null = today
  resolution: "1h"                 # 15-min SDAC prices (since 2025-10-01) are averaged to hourly

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  models_dir: models
  reports_dir: reports
  forecasts_dir: forecasts

entsoe:
  chunk_months: 3                  # size of each API request window
  request_sleep_s: 0.5             # be polite with the API

entsoe_extra:                      # Phase 1 candidate data points (D-24): stored, opt-in only (candidate_features, T45)
  enabled: true
  neighbour_zones: [FR, NL, DE_LU] # DP-029..DP-036: load fc, wind/solar fc, generation fc, actual load (+ FR nuclear gen)
  exchange_borders: [FR, NL, DE_LU, GB]   # DP-026: day-ahead scheduled exchanges (auction results -> lag only)
  hydro_reservoir_zones: [FR, CH]  # DP-044: weekly reservoir filling
  outage_zones: [BE, FR]           # DP-025 / DP-031: unavailable MW as known at the D-1 issue time (11:00, D-29)

weather:
  # archive            -> ERA5 reanalysis (observed weather; optimistic for backtests)
  # historical_forecast -> archived NWP forecasts (realistic, available ~2022+)
  source: archive
  variables: [temperature_2m, wind_speed_100m, shortwave_radiation, cloud_cover]   # 100 m = turbine hub height (DP-020)
  locations:                       # name: [lat, lon]
    brussels: [50.85, 4.35]
    antwerp: [51.22, 4.40]
    liege: [50.63, 5.57]
    offshore_wind_zone: [51.60, 2.90]   # Belgian North Sea concession area (approx.)
  candidate_prefix: wfr_          # DP-043 France temperature (candidate, ignored by features.py until tested)
  candidate_variables: [temperature_2m]
  candidate_locations:             # largest French demand centres (electric heating drives FR load)
    paris: [48.86, 2.35]
    lyon: [45.76, 4.84]
    lille: [50.63, 3.06]
    toulouse: [43.60, 1.44]
    marseille: [43.30, 5.37]

commodities:
  enabled: true
  ttf_ticker: "TTF=F"              # Dutch TTF gas front-month (Yahoo Finance via yfinance)
  ttf_cache: data/raw/ttf_yahoo_cache.csv # every successful Yahoo download is kept here and reused if Yahoo fails
  ttf_csv: data/external/ttf_prices.csv   # fallback / gap filler if Yahoo returns nothing: columns date,price (EUR/MWh)
  eua_csv: data/external/eua_prices.csv   # optional manual CSV override: columns date,price
  raw_dir: data/raw/commodities    # cache for THE / FRED / AGSI downloads
  gas_the_api: true                # D-25: THE (German hub) official daily VTP average price, Oct 2021 ->
  gas_monthly_backfill: true       # D-25: IMF EU gas (FRED PNGASEUUSDM), monthly, 2019 -> Sep 2021 only
  eua_eex_auctions: true           # D-26: EEX primary-auction clearing prices (xlsx in data/raw/eex)
  eex_dir: data/raw/eex
  eua_etc_ticker: "CO2.L"          # D-26: SparkChange EUA ETC (EUR) fills days without an auction report
  coal_ticker: "MTF=F"             # DP-047 candidate: Rotterdam coal (Yahoo; history ends Dec 2025)
  gas_storage_agsi: true           # DP-048 candidate: needs a free AGSI_API_KEY in .env (agsi.gie.eu)
  publication_lag_days: 2          # close of D-2 is the latest known at D-1 11:00 (D-29)

elia:
  enabled: true                    # DP-027 / DP-028: Elia wind (ods031) & solar (ods032 + ods209) forecast runs
  base_url: https://opendata.elia.be/api/explore/v2.1/catalog/datasets
  technologies: [wind, solar]      # columns elia_<tech>_<run>; see data/elia.py for the run publication times

jao:                               # DP-040 candidate: Core flow-based BE min/max net position (jao-py), from Jun 2022
  enabled: true
  zone: BE
  request_sleep_s: 0.2

forecast:
  issue_hour_local: 11             # D-29: issued on D-1 at 11:00 (Elia 11AM wind/solar run; SDAC gate closure 12:00)
  horizon_hours: 24
  min_lag_actuals_h: 48            # actual load/generation for D-1 afternoon is NOT known at issue time
  min_lag_prices_h: 24             # D-1 day-ahead prices are known (auction on D-2)

# T45 — candidate feature families (D-24) with leakage-safe publication lags. OFF by default: used only
# when requested (build_features(candidate_families=[...]) / `backtest --candidates xch nb_actual ...`)
# for the per-family ablation (D-15). Status of every family: candidate, awaiting ablation.
# Issue time D-1 11:00 Brussels (D-29) = 13..36 h (37 h on a 25-h day) before delivery hour t.
# lags_h: 0 = same-time value `<col>`, h > 0 = `<col>_lag<h>` (value at t-h; NaN when t-h is not on a local
# date before the delivery day, i.e. the last hour of the 25-h DST day for 24 h lags). A lag below the hard floor
# features.CANDIDATE_MIN_LAG_H raises an error and is flagged by leakage_check(). Neighbour / JAO
# publication times are not verified yet (T53) -> conservative lags.
candidate_features:
  xch:          # DP-026 day-ahead scheduled exchanges + net position: may include intraday renominations -> as actuals
    rules:
      - {pattern: '^xch_', lags_h: [48, 168]}
  nb_actual:    # DP-029..036 neighbour actual load + FR nuclear generation: same rule as BE actuals (D-05)
    rules:
      - {pattern: '^nb_.+_(load_actual|gen_nuclear)$', lags_h: [48, 168]}
  nb_fc:        # neighbour load / wind / solar / generation forecasts: the D-1 forecast is out by ~18:00 D-2;
                # no same-time use until T53 verifies publication before 11:00
    rules:
      - {pattern: '^nb_.+_(load_fc|fc_.+)$', lags_h: [24, 168]}
  fb:           # DP-040 JAO Core flow-based BE min/max net position (from Jun 2022); same-time pending T53
    rules:
      - {pattern: '^fb_BE_(min|max)_np$', lags_h: [24, 168]}
  unav:         # DP-025/031 nuclear unavailable MW, already rebuilt as known at the issue time (D-27)
    rules:
      - {pattern: '^unav_.+_nuclear_mw$', lags_h: [0]}
    valid_from:                    # NaN before this local date: no ENTSO-E BE message before 2022, 0 = unknown
      unav_BE_nuclear_mw: "2022-01-01"   # all-zero before; first non-zero 2022-01-27 (see METHODOLOGY T45)
    proxies: [nuc_BE_gap_proxy_lag48]    # cap_BE_nuclear - gen_nuclear(t-48 h), full history
  cap:          # DP-024 yearly installed capacity, published before the year (values may be revised afterwards)
    rules:
      - {pattern: '^cap_BE_', lags_h: [0]}
  hydro_res:    # DP-044 weekly reservoir filling, stamped Monday 00:00 of week W, ffilled; out the week after.
                # Assumed out by the end of the Thursday after W -> worst-case safe lag 302 h
                # (features.hydro_min_safe_lag_h; exact 290 h for Monday stamps); 336 h = 14 days, >= 34 h margin
    rules:
      - {pattern: '^hydro_res_.+_mwh$', lags_h: [336]}
  wfr:          # DP-043 Open-Meteo France temperature: same treatment as the w_ weather columns
    rules:
      - {pattern: '^wfr_', lags_h: [0]}
  elia_other:   # DP-027/028 Elia runs other than the 11AM run (which is already a feature, D-29)
    rules:
      - {pattern: '^elia_(wind|solar)_weekaheadforecast$', lags_h: [24]}    # same-time pending T53 (publication time unverified, D-16)
      - {pattern: '^elia_(wind|solar)_dayaheadforecast$', lags_h: [24]}     # latest DA run, after 11:00 D-1
      - {pattern: '^elia_(wind|solar)_measured$', lags_h: [48, 168]}        # estimated actuals
  cmd:          # DP-047 coal: closes already shifted by publication_lag_days (D-2 close); history ends Jan 2026
                # (NaN after) - the ablation decides. DP-048 AGSI gas storage (only with AGSI_API_KEY): gas day X
                # is out ~18:00 CET on X+1 and revised later, but stamped X+2 00:00 UTC -> lag 48 h (floor 48)
    rules:
      - {pattern: '^cmd_coal', lags_h: [0]}
      - {pattern: '^cmd_gas_storage', lags_h: [48]}
  # flag_* columns: never a feature (leakage_check)

targets:
  price: price_da
  production: [gen_total, gen_solar, gen_wind]

split:
  val_start: "2025-05-01"
  test_start: "2025-11-01"
  backtest:
    first_test_month: "2025-11"    # last 12 months: Nov 2025 -> Oct 2026 (15-min MTU era + 2026 nuclear outage)
    n_folds: 12                    # monthly folds, expanding window
    refit_every_fold: true

models:
  price: [naive_day, seasonal_naive_week, ridge, random_forest, lightgbm, xgboost]
  production: [naive_day, seasonal_naive_week, tso_forecast, ridge, lightgbm, xgboost]
  quantiles: [0.1, 0.5, 0.9]       # prediction intervals for the final price model

random_state: 42
