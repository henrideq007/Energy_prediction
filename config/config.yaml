# ---------------------------------------------------------------------------
# Energy Price & Production Forecasting — Belgium (BE bidding zone)
# Every key here is read by src/energy_forecast/config.py.
# Change values here rather than in code, and log important changes in
# docs/DECISIONS.md + the Notion "Decision Log".
# ---------------------------------------------------------------------------

project:
  name: energy-price-prediction
  timezone: Europe/Brussels        # all user-facing outputs in local time
  bidding_zone: BE                 # ENTSO-E area code (entsoe-py)
  neighbours: [FR, NL, DE_LU]      # cross-border price features
  start: "2019-01-01"              # history start (UTC date)
  end: null                        # null = today
  resolution: "1h"                 # 15-min SDAC prices (since 2025-10-01) are averaged to hourly

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  models_dir: models
  reports_dir: reports
  forecasts_dir: forecasts

entsoe:
  chunk_months: 3                  # size of each API request window
  request_sleep_s: 0.5             # be polite with the API

entsoe_extra:                      # Phase 1 candidate data points (D-23): stored, NOT used by features.py yet
  enabled: true
  neighbour_zones: [FR, NL, DE_LU] # DP-029..DP-036: load fc, wind/solar fc, generation fc, actual load (+ FR nuclear gen)
  exchange_borders: [FR, NL, DE_LU, GB]   # DP-026: day-ahead scheduled exchanges (auction results -> lag only)
  hydro_reservoir_zones: [FR, CH]  # DP-044: weekly reservoir filling
  outage_zones: [BE, FR]           # DP-025 / DP-031: unavailable MW as known at D-1 10:00

weather:
  # archive            -> ERA5 reanalysis (observed weather; optimistic for backtests)
  # historical_forecast -> archived NWP forecasts (realistic, available ~2022+)
  source: archive
  variables: [temperature_2m, wind_speed_100m, shortwave_radiation, cloud_cover]   # 100 m = turbine hub height (DP-020)
  locations:                       # name: [lat, lon]
    brussels: [50.85, 4.35]
    antwerp: [51.22, 4.40]
    liege: [50.63, 5.57]
    offshore_wind_zone: [51.60, 2.90]   # Belgian North Sea concession area (approx.)
  candidate_prefix: wfr_          # DP-043 France temperature (candidate, ignored by features.py until tested)
  candidate_variables: [temperature_2m]
  candidate_locations:             # largest French demand centres (electric heating drives FR load)
    paris: [48.86, 2.35]
    lyon: [45.76, 4.84]
    lille: [50.63, 3.06]
    toulouse: [43.60, 1.44]
    marseille: [43.30, 5.37]

commodities:
  enabled: true
  ttf_ticker: "TTF=F"              # Dutch TTF gas front-month (Yahoo Finance via yfinance)
  ttf_csv: data/external/ttf_prices.csv   # fallback / gap filler if Yahoo returns nothing: columns date,price (EUR/MWh)
  eua_csv: data/external/eua_prices.csv   # optional manual CSV override: columns date,price
  raw_dir: data/raw/commodities    # cache for THE / FRED / AGSI downloads
  gas_the_api: true                # D-24: THE (German hub) official daily VTP average price, Oct 2021 ->
  gas_monthly_backfill: true       # D-24: IMF EU gas (FRED PNGASEUUSDM), monthly, 2019 -> Sep 2021 only
  eua_eex_auctions: true           # D-25: EEX primary-auction clearing prices (xlsx in data/raw/eex)
  eex_dir: data/raw/eex
  eua_etc_ticker: "CO2.L"          # D-25: SparkChange EUA ETC (EUR) fills days without an auction report
  coal_ticker: "MTF=F"             # DP-047 candidate: Rotterdam coal (Yahoo; history ends Dec 2025)
  gas_storage_agsi: true           # DP-048 candidate: needs a free AGSI_API_KEY in .env (agsi.gie.eu)
  publication_lag_days: 2          # close of D-2 is the latest known at D-1 10:00

elia:
  enabled: true                    # DP-027 / DP-028: Elia wind (ods031) & solar (ods032 + ods209) forecast runs
  base_url: https://opendata.elia.be/api/explore/v2.1/catalog/datasets
  technologies: [wind, solar]      # columns elia_<tech>_<run>; see data/elia.py for the run publication times

jao:                               # DP-040 candidate: Core flow-based BE min/max net position (jao-py), from Jun 2022
  enabled: true
  zone: BE
  request_sleep_s: 0.2

forecast:
  issue_hour_local: 10             # forecast issued on D-1 at 10:00 (before 12:00 SDAC gate closure)
  horizon_hours: 24
  min_lag_actuals_h: 48            # actual load/generation for D-1 afternoon is NOT known at issue time
  min_lag_prices_h: 24             # D-1 day-ahead prices are known (auction on D-2)

targets:
  price: price_da
  production: [gen_total, gen_solar, gen_wind]

split:
  val_start: "2025-05-01"
  test_start: "2025-11-01"
  backtest:
    first_test_month: "2025-11"    # last 12 months: Nov 2025 -> Oct 2026 (15-min MTU era + 2026 nuclear outage)
    n_folds: 12                    # monthly folds, expanding window
    refit_every_fold: true

models:
  price: [naive_day, seasonal_naive_week, ridge, random_forest, lightgbm, xgboost]
  production: [naive_day, seasonal_naive_week, tso_forecast, ridge, lightgbm, xgboost]
  quantiles: [0.1, 0.5, 0.9]       # prediction intervals for the final price model

random_state: 42
